<!doctype html>
<html lang="en" data-theme="{{.Theme}}" data-accent="{{.Accent}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Knitnox">
  <title>{{block "title" .}}Knitnox{{end}}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{asset "icons/favicon.svg"}}" type="image/svg+xml">
  <link rel="icon" href="{{asset "icons/favicon-32.png"}}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{asset "icons/apple-touch-icon.png"}}">
  <link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>{{/* the same address style.css uses, so the font is fetched once */}}
  <link rel="stylesheet" href="{{asset "style.css"}}">
  <script src="{{asset "vendor/htmx.min.js"}}" defer></script>
  <script src="{{asset "vendor/marked.min.js"}}" defer></script>
  <script src="{{asset "vendor/purify.min.js"}}" defer></script>
  <script src="{{asset "vendor/highlight.min.js"}}" defer></script>
  <script src="{{asset "app.js"}}" defer></script>
  {{block "head" .}}{{end}}
</head>
<body {{if .CSRF}}hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}' data-csrf="{{.CSRF}}" data-vapid="{{.VapidPublic}}" data-tz="{{.Me.Timezone}}" data-tz-auto="{{.Me.TimezoneAuto}}"{{end}}>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="flash" role="status" aria-live="polite"></div>
  {{block "content" .}}{{end}}
  {{if .Me}}{{template "palette" .}}{{end}}
</body>
</html>
