# Publishes a GitHub Release with ready-to-run downloads whenever a version tag
# is pushed:   git tag v1.0.0   then   git push origin v1.0.0
#
# One Linux runner builds all six targets (there is no C code, so Go
# cross-compiles them) and attaches the archives and SHA256SUMS.txt.
# A tag with a hyphen (v1.1.0-rc1) becomes a pre-release, which the website's
# "latest" download links skip. Pushing a tag that already has a release
# replaces its downloads. See docs/BUILD_GUIDE.md, "Release a new version".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -timeout 10m ./...
      - run: bash scripts/build-all.sh "$GITHUB_REF_NAME"
      # A tag that already has a release (the same version, pushed again from a
      # newer commit) keeps its release and gets the downloads replaced.
      - name: Publish the release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Knitnox $GITHUB_REF_NAME" --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
          fi
        env:
          GH_TOKEN: ${{ github.token }}
