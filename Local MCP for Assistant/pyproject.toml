[project]
name = "code-server"
version = "0.1.5"
description = "Local MCP for Assistant with Memory and File Tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.2",
    "kuzu>=0.11.3",
    "mcp>=1.27.1",
    "openai>=2.38.0",
    "playwright>=1.60.0",
    "starlette<0.35.0",
    "uvicorn>=0.48.0",
    "rich>=13.0.0",
]

[project.scripts]
code-server = "cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
